version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: splitflow_postgres
    environment:
      POSTGRES_DB: splitflow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: